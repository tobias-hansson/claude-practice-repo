<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login</title>
<style>
  body {
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background: #f4f4f4;
  }
  .login-box {
    background: #fff;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    width: 280px;
  }
  h2 {
    text-align: center;
    margin-top: 0;
  }
  label {
    display: block;
    margin-bottom: 4px;
    font-size: 14px;
  }
  input {
    width: 100%;
    padding: 8px;
    margin-bottom: 16px;
    box-sizing: border-box;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    width: 100%;
    padding: 10px;
    background: #333;
    color: #fff;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 15px;
  }
  button:hover {
    background: #555;
  }
</style>
</head>
<body>

<div class="login-box">
  <h2>Login</h2>
  <form id="login-form">
    <label for="username">Username</label>
    <input type="text" id="username" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <button type="submit">Log In</button>
  </form>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", function(e) {
  e.preventDefault();
  alert("Login successful");
});
</script>

</body>
</html>

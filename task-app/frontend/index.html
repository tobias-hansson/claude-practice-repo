<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Task List</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 40px auto; }
  #task-list { list-style: none; padding: 0; }
  #task-list li {
    padding: 8px; border: 1px solid #ccc; margin-bottom: 6px;
    border-radius: 4px; display: flex; justify-content: space-between; align-items: center;
  }
  #task-list li.done .task-title { text-decoration: line-through; color: #888; }
  .task-title { cursor: pointer; flex: 1; }
  .delete-btn {
    background: #d9534f; color: #fff; border: none; border-radius: 4px;
    padding: 4px 8px; cursor: pointer; font-size: 12px; margin-left: 10px;
  }
  .delete-btn:hover { background: #c9302c; }
  #add-form { display: flex; gap: 8px; margin-bottom: 20px; }
  #title-input { flex: 1; padding: 6px; }
  button { padding: 6px 12px; }
</style>
</head>
<body>

<h1>Tasks</h1>

<form id="add-form">
  <input type="text" id="title-input" placeholder="New task title" required>
  <button type="submit">Add</button>
</form>

<ul id="task-list"></ul>

<script>
const API_URL = "http://127.0.0.1:8000/tasks";

const taskList = document.getElementById("task-list");
const addForm = document.getElementById("add-form");
const titleInput = document.getElementById("title-input");

async function fetchTasks() {
  const res = await fetch(API_URL);
  const tasks = await res.json();
  renderTasks(tasks);
}

function renderTasks(tasks) {
  taskList.innerHTML = "";
  tasks.forEach(task => {
    const li = document.createElement("li");
    if (task.done) li.classList.add("done");

    const titleSpan = document.createElement("span");
    titleSpan.textContent = task.title;
    titleSpan.className = "task-title";
    titleSpan.addEventListener("click", () => completeTask(task.id));

    const deleteBtn = document.createElement("button");
    deleteBtn.textContent = "Delete";
    deleteBtn.className = "delete-btn";
    deleteBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      deleteTask(task.id);
    });

    li.appendChild(titleSpan);
    li.appendChild(deleteBtn);
    taskList.appendChild(li);
  });
}

async function addTask(title) {
  await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ title })
  });
  fetchTasks();
}

async function completeTask(id) {
  await fetch(`${API_URL}/${id}/complete`, { method: "POST" });
  fetchTasks();
}

async function deleteTask(id) {
  await fetch(`${API_URL}/${id}`, { method: "DELETE" });
  fetchTasks();
}

addForm.addEventListener("submit", (e) => {
  e.preventDefault();
  const title = titleInput.value.trim();
  if (!title) return;
  addTask(title);
  titleInput.value = "";
});

fetchTasks();
</script>

</body>
</html>
